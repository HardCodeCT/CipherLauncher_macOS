name: Build macOS

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

# Force all JS actions (upload-artifact, download-artifact, checkout…)
# onto Node.js 24 now, ahead of the mandatory June 2nd 2026 cutover.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel  # last supported Intel/x86_64 image (replaces deprecated macos-13)
            arch: x86_64
            artifact_name: CipherLauncher_x86_64
          - os: macos-14        # Apple Silicon arm64
            arch: arm64
            artifact_name: CipherLauncher_arm64

    runs-on: ${{ matrix.os }}

    # Prevent Homebrew from auto-updating on every brew command —
    # this is the main reason the arm64 job was taking much longer.
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Cache Homebrew's curl bottle so repeat runs are near-instant.
      # The cache key includes the runner OS so x86_64 and arm64 stay separate.
      - name: Cache Homebrew curl
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/Homebrew/downloads
            ~/Library/Caches/Homebrew/curl--*
          key: brew-curl-${{ matrix.os }}-${{ hashFiles('.github/workflows/build.yml') }}
          restore-keys: |
            brew-curl-${{ matrix.os }}-

      - name: Install libcurl (Homebrew)
        run: brew install curl

      - name: Build CipherLauncher (${{ matrix.arch }})
        run: |
          CURL_PREFIX=$(brew --prefix curl)

          clang++ \
            -std=c++17 \
            -O2 \
            -Wall -Wextra \
            -Wno-unused-parameter \
            -arch ${{ matrix.arch }} \
            -mmacosx-version-min=11.0 \
            -I"${CURL_PREFIX}/include" \
            CipherLauncher/cipher_launcher.cpp \
            -L"${CURL_PREFIX}/lib" -lcurl \
            -framework CoreFoundation \
            -rpath "${CURL_PREFIX}/lib" \
            -o ${{ matrix.artifact_name }}

      - name: Strip binary
        run: strip ${{ matrix.artifact_name }}

      - name: Verify architecture
        run: |
          file ${{ matrix.artifact_name }}
          echo "--- lipo info ---"
          lipo -info ${{ matrix.artifact_name }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}
          retention-days: 30

  universal:
    name: Build Universal Binary (fat)
    needs: build
    runs-on: macos-15

    steps:
      - name: Download x86_64 artifact
        uses: actions/download-artifact@v4
        with:
          name: CipherLauncher_x86_64
          path: artifacts/x86_64

      - name: Download arm64 artifact
        uses: actions/download-artifact@v4
        with:
          name: CipherLauncher_arm64
          path: artifacts/arm64

      - name: Create universal binary with lipo
        run: |
          lipo -create \
            artifacts/x86_64/CipherLauncher_x86_64 \
            artifacts/arm64/CipherLauncher_arm64 \
            -output CipherLauncher_universal

          file CipherLauncher_universal
          lipo -info CipherLauncher_universal

      - name: Upload universal artifact
        uses: actions/upload-artifact@v4
        with:
          name: CipherLauncher_universal
          path: CipherLauncher_universal
          retention-days: 30
