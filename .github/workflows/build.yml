name: Build macOS (Fast Universal)

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew update
          brew install curl

      - name: Build x86_64 + arm64 binaries
        run: |
          CURL_PREFIX=$(brew --prefix curl)

          # Intel build
          clang++ \
            -std=c++17 \
            -O2 \
            -Wall -Wextra \
            -arch x86_64 \
            -mmacosx-version-min=11.0 \
            -I"${CURL_PREFIX}/include" \
            CipherLauncher/cipher_launcher.cpp \
            -L"${CURL_PREFIX}/lib" -lcurl \
            -framework CoreFoundation \
            -o CipherLauncher_x86_64

          # Apple Silicon build
          clang++ \
            -std=c++17 \
            -O2 \
            -Wall -Wextra \
            -arch arm64 \
            -mmacosx-version-min=11.0 \
            -I"${CURL_PREFIX}/include" \
            CipherLauncher/cipher_launcher.cpp \
            -L"${CURL_PREFIX}/lib" -lcurl \
            -framework CoreFoundation \
            -o CipherLauncher_arm64

      - name: Create universal binary
        run: |
          lipo -create \
            CipherLauncher_x86_64 \
            CipherLauncher_arm64 \
            -output CipherLauncher_universal

          file CipherLauncher_universal
          lipo -info CipherLauncher_universal

      - name: Strip binaries
        run: |
          strip CipherLauncher_x86_64 || true
          strip CipherLauncher_arm64 || true
          strip CipherLauncher_universal || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CipherLauncher-macOS-build
          path: |
            CipherLauncher_x86_64
            CipherLauncher_arm64
            CipherLauncher_universal
          retention-days: 30
