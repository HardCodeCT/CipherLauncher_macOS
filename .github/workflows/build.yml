name: Build macOS Universal
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build-arm64:
    runs-on: macos-15
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install curl xz

      - name: Generate resource headers
        run: bash generate_resources.sh

      - name: Build arm64
        run: make

      - name: Strip and scrub metadata
        run: |
          strip -x -S -T CipherLauncher
          xcrun bitcode_strip CipherLauncher -r -o CipherLauncher || true
          xcrun install_name_tool -id "" CipherLauncher 2>/dev/null || true

      - name: Upload arm64 slice
        uses: actions/upload-artifact@v4
        with:
          name: slice-arm64
          path: CipherLauncher
          retention-days: 1

  build-x86_64:
    runs-on: macos-13
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install curl xz

      - name: Generate resource headers
        run: bash generate_resources.sh

      - name: Build x86_64
        run: make

      - name: Strip and scrub metadata
        run: |
          strip -x -S -T CipherLauncher
          xcrun bitcode_strip CipherLauncher -r -o CipherLauncher || true
          xcrun install_name_tool -id "" CipherLauncher 2>/dev/null || true

      - name: Upload x86_64 slice
        uses: actions/upload-artifact@v4
        with:
          name: slice-x86_64
          path: CipherLauncher
          retention-days: 1

  universal:
    name: Build Universal Binary
    needs: [build-arm64, build-x86_64]
    runs-on: macos-15
    steps:
      - name: Download arm64 slice
        uses: actions/download-artifact@v4
        with:
          name: slice-arm64
          path: slices/arm64

      - name: Download x86_64 slice
        uses: actions/download-artifact@v4
        with:
          name: slice-x86_64
          path: slices/x86_64

      - name: Create universal binary
        run: |
          chmod +x slices/arm64/CipherLauncher slices/x86_64/CipherLauncher
          lipo -create \
            slices/arm64/CipherLauncher \
            slices/x86_64/CipherLauncher \
            -output CipherLauncher
          strip -x -S -T CipherLauncher
          xcrun bitcode_strip CipherLauncher -r -o CipherLauncher || true

      - name: Verify
        run: |
          file CipherLauncher
          lipo -info CipherLauncher
          nm CipherLauncher 2>&1 | grep -c ' T ' || echo "No exported text symbols — good"

      - name: Upload universal binary
        uses: actions/upload-artifact@v4
        with:
          name: CipherLauncher_universal
          path: CipherLauncher
          retention-days: 30
